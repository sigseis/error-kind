# ==============================================================================
# CONFIGURATION (https://doc.rust-lang.org/cargo/reference/manifest.html)
# ==============================================================================

# ------------------------------------------------------------------------------
[workspace]
members = [
    "error-kind",
    "error-kind-macros",
]
resolver = "3"

# ------------------------------------------------------------------------------
[workspace.package]
authors = ["Sigseis <sigseis@protonmail.com>"]
documentation = "https://docs.rs/error-kind"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/sigseis/error-kind"
version = "0.0.1"

# ------------------------------------------------------------------------------
[workspace.dependencies]
error-kind-macros = { path = "error-kind-macros", version = "0.0.1"}
proc-macro2 = "1"
quote = "1"
syn = "2"
typed-ident = "0.0.4"

# ------------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "forbid"
